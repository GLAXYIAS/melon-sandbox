name: Mirror Melon Sandbox and publish

# Fetches the official Melon Sandbox Unity WebGL build from the publisher's
# asset host, verifies every file against the pinned SHA-256 manifest, and
# serves it from GitHub Pages, so the game never needs to be iframed from
# melonsandbox.com or any other CDN.  The game build itself is not modified:
# the only change is the small host/no-ad shim injected before the site SDK.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the official build and verify SHA-256
        run: bash scripts/mirror.sh site

      - name: Check the mirror is complete
        run: bash scripts/mirror.sh --check site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: mirror
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
